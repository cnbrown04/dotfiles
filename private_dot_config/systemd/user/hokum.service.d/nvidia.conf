# NVIDIA desktops: Hyprland runs on the NVIDIA card only (AQ_DRM_DEVICES). Left to pick, Hokum's
# Vulkan takes the integrated GPU and its overlay comes out as a solid black box. Pin it to NVIDIA.
[Service]
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/nvidia_icd.json
Environment=VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/nvidia_icd.json
