# Monochrome dark, matched to Ghostty (#1a1a1a @ 40%): bars and borders use
# "default" so the translucent terminal background shows through.
set -g @thm_bg "default"
set -g @thm_fg "#d0d0d0"
set -g @thm_status_bg "default"
set -g @thm_accent "#ffffff"
set -g @thm_on_accent "#1a1a1a"
set -g @thm_red "#e5534b"
set -g @thm_overlay_0 "#6e6e6e"
set -g @thm_overlay_1 "#a8a8a8"

set -g pane-border-style "fg=#{@thm_overlay_0},bg=#{@thm_bg}"
set -g pane-active-border-style "fg=#{@thm_overlay_1},bg=#{@thm_bg}"

# tmux defaults these to yellow; keep them monochrome.
set -g message-style "bg=#{@thm_status_bg},fg=#{@thm_accent},bold"
set -g message-command-style "bg=#{@thm_status_bg},fg=#{@thm_accent}"
set -g mode-style "bg=#4a4a4a,fg=#{@thm_accent}"
set -g menu-style "bg=#{@thm_on_accent},fg=#{@thm_fg}"
set -g menu-selected-style "bg=#{@thm_accent},fg=#{@thm_on_accent}"
set -g menu-border-style "fg=#{@thm_overlay_0}"
# Popups (lazygit): #1a1a1b is Ghostty's popup marker, drawn as #1a1a1a at 75% opacity by its shader.
set -g popup-style "bg=#1a1a1b"
set -g popup-border-style "fg=#{@thm_overlay_0},bg=#1a1a1b"

set -g status-right-length 250
set -g status-right ""

set -g status-position bottom
set -g status-style "bg=#{@thm_status_bg},fg=#{@thm_fg}"
set -g status-justify "absolute-centre"

set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_status_bg},fg=#{@thm_overlay_0}"
set -g window-status-last-style "bg=#{@thm_status_bg},fg=#{@thm_overlay_1}"

set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_accent},bold"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_accent},bold"
set -gF window-status-separator "#[bg=#{@thm_status_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_accent},fg=#{@thm_on_accent},bold"
