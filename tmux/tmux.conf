# True color: inherit Ghostty palette (do not hardcode terminal colors).
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-overrides ",ghostty:RGB"
set -gq allow-passthrough on
# Ensure `clear` can request scrollback wipe inside tmux (CSI 3J / terminfo E3).
set -as terminal-overrides ",*:E3=\e[3J"

# OSC 52: terminal (Terminal.app, iTerm2, Cursor, etc.) updates the local clipboard.
set -g set-clipboard on

set -g mouse on
bind-key -T prefix -N "toggle mouse" M set -g mouse \; display-message "mouse: #{?mouse,on,off}"
set -g base-index 1
setw -g pane-base-index 1
set -g focus-events on
set -as terminal-overrides ",*:XT:focus-events"

# Prefix: Ctrl-b
set -g prefix C-b
bind-key C-b send-prefix

source-file ~/.config/tmux/tmux.theme.inc.conf

set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_blue},fg=#{@thm_status_bg},bold]󰘳 #S },#{#[bg=#{@thm_status_bg},fg=#{@thm_blue}]󰒱 #S }}"
set -ga status-left "#[bg=#{@thm_status_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_status_bg},fg=#{@thm_blue}]󰉋 #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_status_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_status_bg},fg=#{@thm_blue}]#{?window_zoomed_flag,󰁌 zoom ,}"

# Floating lazygit; cwd follows the active pane (prefix g).
bind-key -T prefix -N "lazygit (popup, repo from pane cwd)" g display-popup -d '#{pane_current_path}' -w 90% -h 90% -E lazygit

# tmux plugin manager (TPM)
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm'

run '~/.config/tmux/.tmux/plugins/tpm/tpm'
